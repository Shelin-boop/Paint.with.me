name: Release

# Builds every download and publishes them together:
#
#   - AppImage: runs on almost any 64-bit Linux and brings its own Qt.
#   - .deb (Debian, Ubuntu, Kubuntu, Linux Mint), .rpm (Fedora, openSUSE) and an
#     Arch Linux package: each built on the oldest supported release of its
#     system with that system's own Qt, after all test suites passed there.
#
# Every installer is then installed, started and removed again on fresh
# systems (oldest and newest supported release). Only when all of that passed
# are the files published:
#
#   - Version tag (v*): a GitHub Release with all files.
#   - Manual run (Actions tab, "Run workflow"): replaces the rolling
#     "continuous" pre-release ("Latest build"). The file names stay the same
#     from build to build, so the download buttons in the README always fetch
#     the newest files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version for the AppImage (empty = the tested default below; "latest" = newest Qt 6)'
        required: false
        default: ''
      publish:
        description: 'Publish the files (off: only build and test them)'
        type: boolean
        default: true

permissions:
  contents: write   # create the release and upload the files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: io.github.shelin_boop.PaintWithMe
  # Run the build tools (themselves AppImages) without needing FUSE.
  APPIMAGE_EXTRACT_AND_RUN: 1
  # openSUSE Leap release the .rpm is built on (Leap has no "oldest" tag).
  # Move it on when this release reaches its end of life.
  OPENSUSE_LEAP: opensuse/leap:16.0

jobs:
  setup:
    name: Version and systems
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      fedora_old: ${{ steps.systems.outputs.fedora_old }}
      fedora_old_number: ${{ steps.systems.outputs.fedora_old_number }}
      opensuse_leap: ${{ steps.systems.outputs.opensuse_leap }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so the version (commit count) is real

      - name: Version
        id: version
        run: |
          MM=$(grep -oP 'project\(PaintWithMe VERSION \K[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=${MM}.$(git rev-list --count HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Systems to build on
        id: systems
        run: |
          # Fedora supports its two newest releases: build on the older one,
          # so the package installs on both.
          N=$(docker run --rm fedora:latest sh -c '. /etc/os-release; echo $VERSION_ID')
          echo "Newest Fedora: $N"
          echo "fedora_old=fedora:$((N - 1))" | tee -a "$GITHUB_OUTPUT"
          echo "fedora_old_number=$((N - 1))" | tee -a "$GITHUB_OUTPUT"
          echo "opensuse_leap=$OPENSUSE_LEAP" | tee -a "$GITHUB_OUTPUT"

  appimage:
    name: AppImage
    needs: setup
    # Oldest Ubuntu LTS runner still offered, so the AppImage does not need a
    # newer C library (glibc) than most users' distributions have.
    runs-on: ubuntu-22.04
    outputs:
      qt_version: ${{ steps.summary.outputs.qt_version }}
      glibc: ${{ steps.summary.outputs.glibc }}
    env:
      VER: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build libgl1-mesa-dev zlib1g-dev \
            file wget desktop-file-utils python3-pip xvfb \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 weston \
            xauth libgl1-mesa-dri libegl1
          pip install aqtinstall
          cmake --version

      - name: Install Qt
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          # Tested default. Change it deliberately, after a successful "latest" run.
          QT_VERSION="${QT_VERSION:-6.12.0}"
          if [ "$QT_VERSION" = latest ]; then
            QT_VERSION=$(aqt list-qt linux desktop | tr ' ' '\n' \
              | grep -E '^6\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          ARCH=$(aqt list-qt linux desktop --arch "$QT_VERSION" | tr ' ' '\n' \
            | grep -E '^(linux_gcc_64|gcc_64)$' | head -1)
          echo "Qt $QT_VERSION, arch $ARCH"
          aqt install-qt linux desktop "$QT_VERSION" "$ARCH" -m qtimageformats -O "$GITHUB_WORKSPACE/Qt"
          QMAKE=$(find "$GITHUB_WORKSPACE/Qt/$QT_VERSION" -type f \( -name qmake6 -o -name qmake \) -path '*/bin/*' | head -1)
          QT_ROOT=$(dirname "$(dirname "$QMAKE")")
          echo "QT_VERSION=$QT_VERSION" >> "$GITHUB_ENV"
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          echo "QMAKE=$QMAKE" >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"

      - name: Build and install into an AppDir
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPWM_VERSION="$VER" -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build -j
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Run tests against this Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build -j --target pwm_all_tests
          export LD_LIBRARY_PATH="$QT_ROOT/lib:$LD_LIBRARY_PATH"
          ./build/pwm_integration_tests
          ./build/pwm_tests
          ./build/pwm_psd_tests
          ./build/pwm_pdf_tests
          ./build/pwm_perspective_tests
          ./build/pwm_panel_tests
          ./build/pwm_units_tests
          ./build/pwm_text_tests
          ./build/pwm_rotation_tests
          ./build/pwm_shortcuts_tests
          ./build/pwm_windows_tests
          # With this Qt, CMYK JPEGs arrive as CMYK (Qt 6.8 and newer).
          ./build/pwm_pdfpictures_tests
          # The canvas drawn by OpenGL, with this Qt (Mesa's software renderer).
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            env QT_QPA_PLATFORM=xcb PWM_REQUIRE_GPU=1 ./build/pwm_gpu_tests

      - name: Bundle Qt into the AppDir
        env:
          EXTRA_QT_MODULES: printsupport;waylandcompositor   # the latter: all Wayland plugin folders
        run: |
          # Qt's Wayland display plugins too (X11 is always included), so the
          # app can run natively on Wayland when chosen in Settings. Their names
          # are taken from this Qt, as they may change between Qt versions.
          WAYLAND_PLUGINS=$(cd "$QT_ROOT/plugins/platforms" && ls libqwayland*.so | paste -sd';')
          [ -n "$WAYLAND_PLUGINS" ] || { echo "This Qt has no Wayland platform plugin"; exit 1; }
          echo "Wayland plugins: $WAYLAND_PLUGINS"
          export EXTRA_PLATFORM_PLUGINS="$WAYLAND_PLUGINS"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export LD_LIBRARY_PATH="$QT_ROOT/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file "AppDir/usr/share/applications/$APP_ID.desktop" \
            --icon-file "AppDir/usr/share/icons/hicolor/256x256/apps/$APP_ID.png" \
            --plugin qt
          ls AppDir/usr/plugins/platforms/libqwayland*.so
          # OpenGL for the canvas: on X11 (GLX) and natively on Wayland (EGL).
          ls AppDir/usr/plugins/xcbglintegrations/libqxcb-glx-integration.so
          ls AppDir/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so
          ls AppDir/usr/lib/libQt6OpenGLWidgets.so*
          # Window frames and the xdg-shell protocol, where this Qt has them as plugins.
          ls -R AppDir/usr/plugins | grep -E '^AppDir/usr/plugins/wayland|\.so$' | grep -iE 'wayland|xdg|bradient' || true

      - name: Pack the AppImage (static runtime, no libfuse2 needed)
        run: |
          # The AppImage file's own icon: file managers (Dolphin's "AppImage"
          # preview, AppImageLauncher ...) read .DirIcon at the top of the
          # AppImage. linuxdeploy only put the SVG there, so .DirIcon was
          # missing; a PNG is what every reader can show.
          cp "AppDir/usr/share/icons/hicolor/256x256/apps/$APP_ID.png" AppDir/.DirIcon
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # The same name in every release, so download links stay valid.
          FILE="Paint.with.me-x86_64.AppImage"
          ./appimagetool-x86_64.AppImage AppDir "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Smoke test the AppImage
        run: |
          ./"$FILE" --appimage-extract-and-run --version
          # The file's icon is inside, as a PNG.
          rm -rf squashfs-root
          ./"$FILE" --appimage-extract .DirIcon > /dev/null
          file -L squashfs-root/.DirIcon | grep -q "PNG image data, 256 x 256" \
            || { echo ".DirIcon is missing or not a 256 px PNG"; exit 1; }
          rm -rf squashfs-root
          # Start it headless with an empty home and check that the menu entry appears.
          export HOME="$RUNNER_TEMP/smoke-home" XDG_DATA_HOME="$RUNNER_TEMP/smoke-home/share"
          mkdir -p "$HOME"
          # A virtual X display: the AppImage ships the X11 display plugin, like users get it.
          xvfb-run -a timeout 15 ./"$FILE" --appimage-extract-and-run || code=$?
          # timeout's exit code 124 means it was still running: good.
          [ "${code:-0}" = 124 ] || { echo "AppImage exited early with code ${code:-0}"; exit 1; }
          test -f "$XDG_DATA_HOME/applications/$APP_ID.desktop"
          grep -q "X-PaintWithMe-AppImage=true" "$XDG_DATA_HOME/applications/$APP_ID.desktop"
          desktop-file-validate "$XDG_DATA_HOME/applications/$APP_ID.desktop"
          test -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/$APP_ID.png"

      - name: Smoke test natively on Wayland
        run: |
          # A headless Weston compositor; QT_QPA_PLATFORM=wayland means no
          # fallback to X11, so a missing or broken Wayland plugin fails here.
          export HOME="$RUNNER_TEMP/smoke-home" XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wl-smoke --idle-time=0 > weston.log 2>&1 &
          WESTON=$!
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/wl-smoke" ] && break; sleep 0.2; done
          WAYLAND_DISPLAY=wl-smoke QT_QPA_PLATFORM=wayland \
            timeout 15 ./"$FILE" --appimage-extract-and-run 2> wayland.log || code=$?
          kill "$WESTON" || true
          cat wayland.log
          [ "${code:-0}" = 124 ] || { echo "AppImage exited early on Wayland with code ${code:-0}"; exit 1; }
          # Without a shell integration Qt keeps running but shows no windows.
          if grep -E 'Loading shell integration failed|No shell integration|Could not load the Qt platform plugin' wayland.log; then
            echo "The Wayland plugins are incomplete"; exit 1
          fi

      - name: Summary
        id: summary
        run: |
          RUNTIME=$(head -c 2000000 "$FILE" > runtime.bin; file runtime.bin)
          GLIBC=$(find AppDir -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          {
            echo "### $FILE ($VER)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Qt | $QT_VERSION |"
            echo "| Needs glibc | ${GLIBC#GLIBC_} or newer |"
            echo "| Size | $(du -h "$FILE" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$FILE" | cut -d' ' -f1)\` |"
            echo "| Runtime | ${RUNTIME#runtime.bin: } |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "glibc=${GLIBC#GLIBC_}" >> "$GITHUB_OUTPUT"
          echo "qt_version=$QT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Paint.with.me-x86_64.AppImage

  deb:
    name: .deb (Debian 12)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and test on Debian 12
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 \
            packaging/build-deb.sh "${{ needs.setup.outputs.version }}" dist

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/

  rpm:
    name: .rpm (${{ matrix.system }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: fedora
            image: ${{ needs.setup.outputs.fedora_old }}
          - system: opensuse
            image: ${{ needs.setup.outputs.opensuse_leap }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and test on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" \
            packaging/build-rpm.sh "${{ needs.setup.outputs.version }}" dist

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.system }}
          path: dist/

  arch:
    name: Arch Linux package
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and test on Arch Linux
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest \
            packaging/build-arch.sh "${{ needs.setup.outputs.version }}" dist

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/

  install-test:
    name: Install on ${{ matrix.image }}
    needs: [setup, deb, rpm, arch]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: deb, file: paint-with-me_amd64.deb, image: 'debian:12' }
          - { artifact: deb, file: paint-with-me_amd64.deb, image: 'debian:13' }
          - { artifact: deb, file: paint-with-me_amd64.deb, image: 'ubuntu:24.04' }
          - { artifact: deb, file: paint-with-me_amd64.deb, image: 'ubuntu:latest' }
          - { artifact: deb, file: paint-with-me_amd64.deb, image: 'ubuntu:rolling' }
          - { artifact: rpm-fedora, file: paint-with-me-fedora.x86_64.rpm, image: '${{ needs.setup.outputs.fedora_old }}' }
          - { artifact: rpm-fedora, file: paint-with-me-fedora.x86_64.rpm, image: 'fedora:latest' }
          - { artifact: rpm-opensuse, file: paint-with-me-opensuse.x86_64.rpm, image: '${{ needs.setup.outputs.opensuse_leap }}' }
          - { artifact: rpm-opensuse, file: paint-with-me-opensuse.x86_64.rpm, image: 'opensuse/tumbleweed' }
          - { artifact: arch, file: paint-with-me-arch-x86_64.pkg.tar.zst, image: 'archlinux:latest' }
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install, start and remove it
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" \
            packaging/test-installed-package.sh "dist/${{ matrix.file }}"

  publish:
    name: Publish
    needs: [setup, appimage, install-test]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.setup.outputs.version }}
      QT_VERSION: ${{ needs.appimage.outputs.qt_version }}
      GLIBC_MIN: ${{ needs.appimage.outputs.glibc }}
      FEDORA: ${{ needs.setup.outputs.fedora_old_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          FILES="Paint.with.me-x86_64.AppImage paint-with-me_amd64.deb
                 paint-with-me-fedora.x86_64.rpm paint-with-me-opensuse.x86_64.rpm
                 paint-with-me-arch-x86_64.pkg.tar.zst"
          (cd dist && sha256sum $FILES > SHA256SUMS && cat SHA256SUMS)
          echo "FILES=$(echo $FILES) SHA256SUMS" >> "$GITHUB_ENV"
          LEAP=$(echo "$OPENSUSE_LEAP" | sed 's/.*://')
          BUILT=$(for f in deb fedora opensuse arch; do echo "- \`$f\`: $(cat dist/$f.txt)"; done)
          sed -e "s/@VER@/$VER/g" -e "s/@SHA@/${GITHUB_SHA:0:7}/g" -e "s/@QT@/$QT_VERSION/g" \
              -e "s/@GLIBC@/$GLIBC_MIN/g" -e "s/@FEDORA@/$FEDORA/g" -e "s/@LEAP@/$LEAP/g" \
              packaging/release-notes.md > notes.md
          printf '\nBuilt and tested:\n%s\n' "$BUILT" >> notes.md
          cat notes.md

      - name: Publish the release
        run: |
          cd dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" \
              --title "Paint.with.me $TAG" --notes-file ../notes.md --verify-tag
          else
            TAG=continuous
            # Rolling pre-release: replace it, moving its tag to this commit.
            gh release delete continuous --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            gh release create continuous $FILES --repo "$GITHUB_REPOSITORY" \
              --prerelease --target "$GITHUB_SHA" \
              --title "Latest build ($VER)" --notes-file ../notes.md
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check the download links
        run: |
          # Every published file, and every download link in the README
          # (they point to the "continuous" release), must answer.
          check() {
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$1")
            echo "$code $1"
            [ "$code" = 200 ]
          }
          ok=true
          for f in $FILES; do
            check "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$f" || ok=false
          done
          if [ "$TAG" = continuous ]; then
            for url in $(grep -oE "https://github.com/$GITHUB_REPOSITORY/releases/download/continuous/[^\")> ]+" README.md | sort -u); do
              check "$url" || ok=false
            done
          fi
          $ok
