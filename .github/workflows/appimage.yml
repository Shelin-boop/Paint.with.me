name: AppImage

# Builds a portable AppImage: download, make executable, run. On its first
# start it adds itself to the application menu.
#
#   - Version tag (v*): creates a GitHub Release with the AppImage.
#   - Manual run (Actions tab, "Run workflow"): replaces the rolling
#     "continuous" pre-release, so there is always one current download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version (empty = the tested default below; "latest" = newest Qt 6)'
        required: false
        default: ''

permissions:
  contents: write   # create the release and upload the AppImage

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: io.github.shelin_boop.PaintWithMe
  # Run the build tools (themselves AppImages) without needing FUSE.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  appimage:
    # Oldest Ubuntu LTS runner still offered, so the AppImage does not need a
    # newer C library (glibc) than most users' distributions have.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so the version (commit count) is real

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build libgl1-mesa-dev zlib1g-dev \
            file wget desktop-file-utils python3-pip xvfb \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 weston
          pip install aqtinstall
          cmake --version

      - name: Install Qt
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          # Tested default. Change it deliberately, after a successful "latest" run.
          QT_VERSION="${QT_VERSION:-6.12.0}"
          if [ "$QT_VERSION" = latest ]; then
            QT_VERSION=$(aqt list-qt linux desktop | tr ' ' '\n' \
              | grep -E '^6\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          ARCH=$(aqt list-qt linux desktop --arch "$QT_VERSION" | tr ' ' '\n' \
            | grep -E '^(linux_gcc_64|gcc_64)$' | head -1)
          echo "Qt $QT_VERSION, arch $ARCH"
          aqt install-qt linux desktop "$QT_VERSION" "$ARCH" -m qtimageformats -O "$GITHUB_WORKSPACE/Qt"
          QMAKE=$(find "$GITHUB_WORKSPACE/Qt/$QT_VERSION" -type f \( -name qmake6 -o -name qmake \) -path '*/bin/*' | head -1)
          QT_ROOT=$(dirname "$(dirname "$QMAKE")")
          echo "QT_VERSION=$QT_VERSION" >> "$GITHUB_ENV"
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          echo "QMAKE=$QMAKE" >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"

      - name: Build and install into an AppDir
        run: |
          MM=$(grep -oP 'project\(PaintWithMe VERSION \K[0-9]+\.[0-9]+' CMakeLists.txt)
          VER="${MM}.$(git rev-list --count HEAD)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPWM_VERSION="$VER" -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build -j
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Run tests against this Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build -j --target pwm_tests pwm_psd_tests pwm_pdf_tests pwm_perspective_tests pwm_panel_tests pwm_integration_tests pwm_units_tests pwm_text_tests pwm_pdfpictures_tests
          export LD_LIBRARY_PATH="$QT_ROOT/lib:$LD_LIBRARY_PATH"
          ./build/pwm_integration_tests
          ./build/pwm_tests
          ./build/pwm_psd_tests
          ./build/pwm_pdf_tests
          ./build/pwm_perspective_tests
          ./build/pwm_panel_tests
          ./build/pwm_units_tests
          ./build/pwm_text_tests
          # With this Qt, CMYK JPEGs arrive as CMYK (Qt 6.8 and newer).
          ./build/pwm_pdfpictures_tests

      - name: Bundle Qt into the AppDir
        env:
          EXTRA_QT_MODULES: printsupport;waylandcompositor   # the latter: all Wayland plugin folders
        run: |
          # Qt's Wayland display plugins too (X11 is always included), so the
          # app can run natively on Wayland when chosen in Settings. Their names
          # are taken from this Qt, as they may change between Qt versions.
          WAYLAND_PLUGINS=$(cd "$QT_ROOT/plugins/platforms" && ls libqwayland*.so | paste -sd';')
          [ -n "$WAYLAND_PLUGINS" ] || { echo "This Qt has no Wayland platform plugin"; exit 1; }
          echo "Wayland plugins: $WAYLAND_PLUGINS"
          export EXTRA_PLATFORM_PLUGINS="$WAYLAND_PLUGINS"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export LD_LIBRARY_PATH="$QT_ROOT/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file "AppDir/usr/share/applications/$APP_ID.desktop" \
            --icon-file "AppDir/usr/share/icons/hicolor/256x256/apps/$APP_ID.png" \
            --plugin qt
          ls AppDir/usr/plugins/platforms/libqwayland*.so
          # Window frames and the xdg-shell protocol, where this Qt has them as plugins.
          ls -R AppDir/usr/plugins | grep -E '^AppDir/usr/plugins/wayland|\.so$' | grep -iE 'wayland|xdg|bradient' || true

      - name: Pack the AppImage (static runtime, no libfuse2 needed)
        run: |
          # The AppImage file's own icon: file managers (Dolphin's "AppImage"
          # preview, AppImageLauncher ...) read .DirIcon at the top of the
          # AppImage. linuxdeploy only put the SVG there, so .DirIcon was
          # missing; a PNG is what every reader can show.
          cp "AppDir/usr/share/icons/hicolor/256x256/apps/$APP_ID.png" AppDir/.DirIcon
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          FILE="Paint.with.me-${VER}-x86_64.AppImage"
          ./appimagetool-x86_64.AppImage AppDir "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Smoke test the AppImage
        run: |
          ./"$FILE" --appimage-extract-and-run --version
          # The file's icon is inside, as a PNG.
          rm -rf squashfs-root
          ./"$FILE" --appimage-extract .DirIcon > /dev/null
          file -L squashfs-root/.DirIcon | grep -q "PNG image data, 256 x 256" \
            || { echo ".DirIcon is missing or not a 256 px PNG"; exit 1; }
          rm -rf squashfs-root
          # Start it headless with an empty home and check that the menu entry appears.
          export HOME="$RUNNER_TEMP/smoke-home" XDG_DATA_HOME="$RUNNER_TEMP/smoke-home/share"
          mkdir -p "$HOME"
          # A virtual X display: the AppImage ships the X11 display plugin, like users get it.
          xvfb-run -a timeout 15 ./"$FILE" --appimage-extract-and-run || code=$?
          # timeout's exit code 124 means it was still running: good.
          [ "${code:-0}" = 124 ] || { echo "AppImage exited early with code ${code:-0}"; exit 1; }
          test -f "$XDG_DATA_HOME/applications/$APP_ID.desktop"
          grep -q "X-PaintWithMe-AppImage=true" "$XDG_DATA_HOME/applications/$APP_ID.desktop"
          desktop-file-validate "$XDG_DATA_HOME/applications/$APP_ID.desktop"
          test -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/$APP_ID.png"

      - name: Smoke test natively on Wayland
        run: |
          # A headless Weston compositor; QT_QPA_PLATFORM=wayland means no
          # fallback to X11, so a missing or broken Wayland plugin fails here.
          export HOME="$RUNNER_TEMP/smoke-home" XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wl-smoke --idle-time=0 > weston.log 2>&1 &
          WESTON=$!
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/wl-smoke" ] && break; sleep 0.2; done
          WAYLAND_DISPLAY=wl-smoke QT_QPA_PLATFORM=wayland \
            timeout 15 ./"$FILE" --appimage-extract-and-run 2> wayland.log || code=$?
          kill "$WESTON" || true
          cat wayland.log
          [ "${code:-0}" = 124 ] || { echo "AppImage exited early on Wayland with code ${code:-0}"; exit 1; }
          # Without a shell integration Qt keeps running but shows no windows.
          if grep -E 'Loading shell integration failed|No shell integration|Could not load the Qt platform plugin' wayland.log; then
            echo "The Wayland plugins are incomplete"; exit 1
          fi

      - name: Summary
        run: |
          RUNTIME=$(head -c 2000000 "$FILE" > runtime.bin; file runtime.bin)
          GLIBC=$(find AppDir -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          {
            echo "### $FILE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Qt | $QT_VERSION |"
            echo "| Needs glibc | ${GLIBC#GLIBC_} or newer |"
            echo "| Size | $(du -h "$FILE" | cut -f1) |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$FILE.sha256")\` |"
            echo "| Runtime | ${RUNTIME#runtime.bin: } |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GLIBC_MIN=${GLIBC#GLIBC_}" >> "$GITHUB_ENV"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            Paint.with.me-*-x86_64.AppImage
            Paint.with.me-*-x86_64.AppImage.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Paint.with.me $VER**, built from \`${GITHUB_SHA:0:7}\` with Qt $QT_VERSION.

          How to use it:
          1. Download \`$FILE\`.
          2. Make it executable: right-click, Properties, Permissions, "Is executable",
             or \`chmod +x $FILE\` in a terminal.
          3. Start it. On the first start it adds itself to your application menu
             (Help > Remove from application menu takes it out again).

          Needs a 64-bit Linux with glibc $GLIBC_MIN or newer, for example
          Ubuntu/Kubuntu 22.04 or newer. No other installation is needed.

          Check the download: \`sha256sum -c $FILE.sha256\`
          EOF
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" "$FILE" "$FILE.sha256" \
              --title "Paint.with.me $TAG" --notes-file notes.md --verify-tag
          else
            # Rolling pre-release: replace it, moving its tag to this commit.
            gh release delete continuous --yes --cleanup-tag || true
            gh release create continuous "$FILE" "$FILE.sha256" \
              --prerelease --target "$GITHUB_SHA" \
              --title "Latest build ($VER)" --notes-file notes.md
          fi
